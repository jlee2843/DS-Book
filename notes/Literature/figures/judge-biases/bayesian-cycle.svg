<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">Where prior, likelihood and posterior enter</title><desc id="desc">The observation model and scores produce the likelihood. Prior and likelihood produce a posterior, which produces predictions. An optional cycle uses only new data.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#222"/></marker></defs>
<rect width="760" height="850" fill="#fafafa"/>
<g fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"><path d="M440 125 V155"/><path d="M440 245 V275"/><path d="M440 365 V445 H315"/><path d="M122 365 V400"/><path d="M175 490 V535 H350"/><path d="M500 580 V635"/><path d="M650 535 H720 V35 H122 V275" stroke-dasharray="7 7"/></g>
<g stroke="#222" stroke-width="1.5"><rect x="270" y="50" width="340" height="75" fill="#fff"/><rect x="270" y="155" width="340" height="90" fill="#fff"/><rect x="270" y="275" width="340" height="90" fill="#eee"/><rect x="25" y="275" width="195" height="90" fill="#eee"/><rect x="35" y="400" width="280" height="90" fill="#fff"/><rect x="350" y="490" width="300" height="90" fill="#ddd"/><rect x="280" y="635" width="370" height="100" fill="#fff"/></g>
<g font-family="Arial,sans-serif" fill="#191919" text-anchor="middle"><g font-size="20" font-weight="bold"><text x="440" y="80">Ordered Logistic</text><text x="440" y="185">Observed scores</text><text x="440" y="305">LIKELIHOOD</text><text x="122" y="305">PRIOR</text><text x="175" y="430">Bayesian inference</text><text x="500" y="520">POSTERIOR</text><text x="465" y="665">Posterior prediction</text></g>
<g font-size="16"><text x="440" y="106">Score probabilities given parameters</text><text x="440" y="213">Evaluate their probabilities</text><text x="440" y="234">under each parameter setting</text><text x="440" y="333">How well parameters explain scores</text><text x="440" y="353">Section 3.1, Equation (1)</text><text x="122" y="332">Parameter assumptions</text><text x="122" y="353">Appendix A.2</text><text x="175" y="457">Prior × likelihood</text><text x="175" y="479">then normalize</text><text x="500" y="548">Updated parameter distribution</text><text x="500" y="570">Figure 1, right panel</text><text x="465" y="693">Simulate scores from posterior draws</text><text x="465" y="716">Then calculate agreement, as in Figure 5</text><text x="410" y="25">Optional cycle: posterior becomes next prior</text><text x="380" y="785">Use only NEW data in the next likelihood.</text><text x="380" y="813">This is not repeated use of the same scores.</text></g></g></svg>
