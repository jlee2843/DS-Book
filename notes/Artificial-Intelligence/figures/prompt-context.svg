<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Relevant material inside the context boundary and distracting material outside</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="240" y="35" text-anchor="middle" font-size="20" font-weight="bold">CONTEXT WINDOW</text><rect x="35" y="65" width="420" height="235" rx="14" fill="#fff" stroke="#555"/><rect x="60" y="85" width="370" height="44" rx="4" fill="#e7e7e7" stroke="#555"/><text x="245" y="113" text-anchor="middle" font-size="18" font-weight="normal">Critical instructions</text><rect x="60" y="145" width="370" height="44" rx="4" fill="#e7e7e7" stroke="#555"/><text x="245" y="173" text-anchor="middle" font-size="18" font-weight="normal">Accepted decisions</text><rect x="60" y="205" width="370" height="44" rx="4" fill="#e7e7e7" stroke="#555"/><text x="245" y="233" text-anchor="middle" font-size="18" font-weight="normal">Relevant evidence</text><text x="590" y="89" text-anchor="middle" font-size="18" font-weight="bold">LEAVE OUT</text><text x="590" y="145" text-anchor="middle" font-size="17" font-weight="normal">Unrelated logs</text><text x="590" y="195" text-anchor="middle" font-size="17" font-weight="normal">Stale drafts</text><text x="590" y="245" text-anchor="middle" font-size="17" font-weight="normal">Duplicate material</text><path d="M495 120V265" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/><text x="360" y="338" text-anchor="middle" font-size="17" font-weight="normal">Keep the information that changes the answer.</text></g></svg>