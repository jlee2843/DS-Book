<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>A draft separates into preserved decisions and targeted changes before verification</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><rect x="30" y="125" width="125" height="85" rx="12" fill="#fff" stroke="#555"/><text x="92" y="175" text-anchor="middle" font-size="19" font-weight="bold">DRAFT</text><path d="M163 145L245 75" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M163 192L245 265" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="370" y="65" text-anchor="middle" font-size="19" font-weight="bold">KEEP</text><text x="370" y="95" text-anchor="middle" font-size="17" font-weight="normal">Accepted decisions</text><text x="370" y="250" text-anchor="middle" font-size="19" font-weight="bold">CHANGE</text><text x="370" y="280" text-anchor="middle" font-size="17" font-weight="normal">Specific observed failure</text><path d="M475 80L555 145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M475 265L555 190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><circle cx="625" cy="170" r="55" fill="#e4e4e4" stroke="#555"/><text x="625" y="175" text-anchor="middle" font-size="18" font-weight="bold">RECHECK</text><text x="360" y="338" text-anchor="middle" font-size="17" font-weight="normal">Revise the failing part without losing what already works.</text></g></svg>