<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Contrastive training pulls relevant pairs together and separates irrelevant pairs</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold">TRAINING CHANGES THE REPRESENTATION</text><circle cx="340" cy="165" r="38" fill="#ddd" stroke="#555"/><text x="340" y="171" text-anchor="middle" font-size="17" font-weight="normal">query</text><circle cx="150" cy="165" r="34" fill="#fff" stroke="#555"/><text x="150" y="171" text-anchor="middle" font-size="16" font-weight="normal">match</text><circle cx="565" cy="85" r="33" fill="#fff" stroke="#555"/><text x="565" y="91" text-anchor="middle" font-size="16" font-weight="normal">other</text><circle cx="565" cy="245" r="33" fill="#fff" stroke="#555"/><text x="565" y="251" text-anchor="middle" font-size="16" font-weight="normal">other</text><path d="M190 165H292" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="240" y="140" text-anchor="middle" font-size="15" font-weight="normal">pull closer</text><path d="M385 145L520 98" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M385 187L520 232" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="470" y="175" text-anchor="middle" font-size="15" font-weight="normal">push apart</text><path d="M300 270H415L440 300H270Z" fill="none" stroke="#555" stroke-width="2"/><text x="355" y="322" text-anchor="middle" font-size="17" font-weight="normal">Ranking loss → encoder update</text></g></svg>