<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Inventory and unsupported tool additions propagate into the recipe</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="155" y="42" text-anchor="middle" font-size="18" font-weight="bold">CONFIRMED INVENTORY</text><rect x="30" y="65" width="250" height="210" rx="16" fill="#fff" stroke="#555"/><text x="155" y="103" text-anchor="middle" font-size="18" font-weight="normal">pasta</text><text x="155" y="146" text-anchor="middle" font-size="18" font-weight="normal">eggs</text><text x="155" y="189" text-anchor="middle" font-size="18" font-weight="normal">parmesan</text><text x="155" y="232" text-anchor="middle" font-size="18" font-weight="normal">spinach</text><text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold">TOOL ADDS</text><circle cx="400" cy="166" r="77" fill="#e1e1e1" stroke="#555"/><text x="400" y="137" text-anchor="middle" font-size="18" font-weight="normal">butter</text><text x="400" y="170" text-anchor="middle" font-size="18" font-weight="normal">garlic</text><text x="400" y="203" text-anchor="middle" font-size="18" font-weight="normal">milk</text><path d="M288 166H315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M483 166H545" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="622" y="145" text-anchor="middle" font-size="18" font-weight="normal">Recipe uses</text><text x="622" y="175" text-anchor="middle" font-size="18" font-weight="normal">unsupported</text><text x="622" y="205" text-anchor="middle" font-size="18" font-weight="normal">ingredients</text><text x="360" y="325" text-anchor="middle" font-size="16" font-weight="normal">Fix the pantry contract where the unsupported assumptions enter.</text></g></svg>