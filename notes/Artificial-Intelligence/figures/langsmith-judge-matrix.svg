<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Independent realism and safety labels create a two by two evaluation matrix</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold">TWO CRITERIA, FOUR OUTCOMES</text><rect x="185" y="75" width="480" height="225" rx="0" fill="#fff" stroke="#555"/><path d="M425 75V300M185 188H665" fill="none" stroke="#555" stroke-width="2"/><text x="305" y="60" text-anchor="middle" font-size="17" font-weight="normal">Realistic</text><text x="545" y="60" text-anchor="middle" font-size="17" font-weight="normal">Not realistic</text><text x="90" y="135" text-anchor="middle" font-size="16" font-weight="normal">Safety pass</text><text x="90" y="250" text-anchor="middle" font-size="16" font-weight="normal">Safety fail</text><text x="305" y="135" text-anchor="middle" font-size="18" font-weight="normal">Both pass</text><text x="545" y="135" text-anchor="middle" font-size="18" font-weight="normal">Revise the dish</text><text x="305" y="247" text-anchor="middle" font-size="18" font-weight="normal">Revise unsafe steps</text><text x="545" y="247" text-anchor="middle" font-size="18" font-weight="normal">Both fail</text><text x="425" y="333" text-anchor="middle" font-size="17" font-weight="normal">Keep the two labels separate.</text></g></svg>