<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Four checkpoints on an execution timeline with a repeat path</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><path d="M65 130H655" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><circle cx="85" cy="130" r="19" fill="#ddd" stroke="#555"/><text x="85" y="136" text-anchor="middle" font-size="16" font-weight="normal">1</text><text x="85" y="85" text-anchor="middle" font-size="17" font-weight="bold">SELECT</text><path d="M85 151V200" fill="none" stroke="#555" stroke-width="2"/><text x="85" y="228" text-anchor="middle" font-size="15" font-weight="normal">Tool + arguments</text><circle cx="265" cy="130" r="19" fill="#ddd" stroke="#555"/><text x="265" y="136" text-anchor="middle" font-size="16" font-weight="normal">2</text><text x="265" y="85" text-anchor="middle" font-size="17" font-weight="bold">EXECUTE</text><path d="M265 151V200" fill="none" stroke="#555" stroke-width="2"/><text x="265" y="228" text-anchor="middle" font-size="15" font-weight="normal">Returned status</text><circle cx="445" cy="130" r="19" fill="#ddd" stroke="#555"/><text x="445" y="136" text-anchor="middle" font-size="16" font-weight="normal">3</text><text x="445" y="85" text-anchor="middle" font-size="17" font-weight="bold">INTERPRET</text><path d="M445 151V200" fill="none" stroke="#555" stroke-width="2"/><text x="445" y="228" text-anchor="middle" font-size="15" font-weight="normal">Use the result</text><circle cx="625" cy="130" r="19" fill="#ddd" stroke="#555"/><text x="625" y="136" text-anchor="middle" font-size="16" font-weight="normal">4</text><text x="625" y="85" text-anchor="middle" font-size="17" font-weight="bold">VERIFY</text><path d="M625 151V200" fill="none" stroke="#555" stroke-width="2"/><text x="625" y="228" text-anchor="middle" font-size="15" font-weight="normal">Check outcome</text><path d="M610 260V300H35V130H60" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 5"/><text x="360" y="328" text-anchor="middle" font-size="17" font-weight="normal">Another action? Preserve the trace and repeat.</text></g></svg>