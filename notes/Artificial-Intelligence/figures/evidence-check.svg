<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Exact and semantic search converge at an evidence validation gate</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="135" y="55" text-anchor="middle" font-size="18" font-weight="bold">EXACT SEARCH</text><text x="135" y="87" text-anchor="middle" font-size="15" font-weight="normal">IDs · versions · error codes</text><text x="135" y="233" text-anchor="middle" font-size="18" font-weight="bold">SEMANTIC SEARCH</text><text x="135" y="265" text-anchor="middle" font-size="15" font-weight="normal">Related explanations</text><path d="M265 70L330 143" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M265 245L330 208" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M370 105L440 175L370 245L300 175Z" fill="none" stroke="#555" stroke-width="2"/><text x="370" y="166" text-anchor="middle" font-size="17" font-weight="normal">Check</text><text x="370" y="188" text-anchor="middle" font-size="17" font-weight="normal">evidence</text><path d="M445 175H520" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="535" y="100" width="155" height="155" rx="0" fill="#fff" stroke="#555"/><text x="612" y="140" text-anchor="middle" font-size="18" font-weight="normal">Cited answer</text><text x="612" y="177" text-anchor="middle" font-size="16" font-weight="normal">Known facts</text><text x="612" y="205" text-anchor="middle" font-size="16" font-weight="normal">Uncertainty</text><text x="360" y="325" text-anchor="middle" font-size="17" font-weight="normal">Gate: current version, access, relevance, and support.</text></g></svg>