<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Four complementary parts of a task brief surround the deliverable</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><rect x="245" y="115" width="230" height="115" rx="16" fill="#e4e4e4" stroke="#555"/><text x="360" y="160" text-anchor="middle" font-size="21" font-weight="bold">DELIVERABLE</text><text x="360" y="192" text-anchor="middle" font-size="17" font-weight="normal">What should exist?</text><text x="135" y="65" text-anchor="middle" font-size="18" font-weight="bold">GOAL</text><text x="135" y="92" text-anchor="middle" font-size="16" font-weight="normal">Purpose and audience</text><text x="585" y="65" text-anchor="middle" font-size="18" font-weight="bold">EVIDENCE</text><text x="585" y="92" text-anchor="middle" font-size="16" font-weight="normal">Relevant inputs</text><text x="135" y="285" text-anchor="middle" font-size="18" font-weight="bold">CONSTRAINTS</text><text x="135" y="312" text-anchor="middle" font-size="16" font-weight="normal">Limits and priorities</text><text x="585" y="285" text-anchor="middle" font-size="18" font-weight="bold">CHECK</text><text x="585" y="312" text-anchor="middle" font-size="16" font-weight="normal">Observable success</text><path d="M185 95L260 135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M530 95L465 135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M185 260L260 215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M530 260L465 215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/></g></svg>