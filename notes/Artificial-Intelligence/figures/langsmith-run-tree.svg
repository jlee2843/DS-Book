<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Support agent trace as a run tree</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><text x="35" y="40" text-anchor="start" font-size="20" font-weight="bold">REQUEST: Where is order 4821?</text><path d="M55 65V285M55 100H115M55 180H115M55 260H115" fill="none" stroke="#555" stroke-width="2"/><circle cx="55" cy="100" r="5" fill="#333" stroke="#555"/><text x="130" y="100" text-anchor="start" font-size="19" font-weight="normal">Model: choose lookup_order</text><text x="130" y="129" text-anchor="start" font-size="16" font-weight="normal">Argument: order_id = 4821</text><circle cx="55" cy="180" r="5" fill="#333" stroke="#555"/><text x="130" y="180" text-anchor="start" font-size="19" font-weight="normal">Tool: lookup_order</text><text x="130" y="209" text-anchor="start" font-size="16" font-weight="normal">Result: shipped; delivery Friday</text><circle cx="55" cy="260" r="5" fill="#333" stroke="#555"/><text x="130" y="260" text-anchor="start" font-size="19" font-weight="normal">Model: write the reply</text><text x="130" y="289" text-anchor="start" font-size="16" font-weight="normal">Output: order shipped and arrives Friday</text></g></svg>