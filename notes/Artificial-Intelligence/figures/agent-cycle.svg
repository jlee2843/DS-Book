<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310"><rect width="680" height="310" fill="#f5f5f5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#333"/></marker></defs><rect x="20" y="20" width="300" height="98" fill="white" stroke="#555"/><text x="32" y="39" font-family="monospace" font-size="12" fill="#666">01</text><text x="170" y="66" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18">PLAN</text><text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="16">Choose the next step</text><rect x="360" y="20" width="300" height="98" fill="white" stroke="#555"/><text x="372" y="39" font-family="monospace" font-size="12" fill="#666">02</text><text x="510" y="66" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18">ACT</text><text x="510" y="94" text-anchor="middle" font-family="Arial" font-size="16">Call a permitted tool</text><rect x="360" y="158" width="300" height="98" fill="white" stroke="#555"/><text x="372" y="177" font-family="monospace" font-size="12" fill="#666">03</text><text x="510" y="204" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18">OBSERVE</text><text x="510" y="232" text-anchor="middle" font-family="Arial" font-size="16">Read the actual result</text><rect x="20" y="158" width="300" height="98" fill="white" stroke="#555"/><text x="32" y="177" font-family="monospace" font-size="12" fill="#666">04</text><text x="170" y="204" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18">DECIDE</text><text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="16">Stop or revise the plan</text><path d="M325 69 H350" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M510 123 V148" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M350 207 H330" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="279" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">If evidence is insufficient, return to PLAN; a tool call alone is not success.</text></svg>