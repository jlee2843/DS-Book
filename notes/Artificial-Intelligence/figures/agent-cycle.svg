<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Plan act observe decide loop with a stop branch</title><rect width="720" height="360" fill="#f5f5f5"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#555"/></marker></defs><g font-family="Arial,sans-serif" fill="#222"><circle cx="360" cy="170" r="62" fill="#e5e5e5" stroke="#555"/><text x="360" y="166" text-anchor="middle" font-size="20" font-weight="bold">AGENT</text><text x="360" y="190" text-anchor="middle" font-size="14" font-weight="normal">repeat as needed</text><text x="360" y="42" text-anchor="middle" font-size="19" font-weight="bold">PLAN</text><text x="590" y="170" text-anchor="middle" font-size="19" font-weight="bold">ACT</text><text x="360" y="305" text-anchor="middle" font-size="19" font-weight="bold">OBSERVE</text><text x="130" y="170" text-anchor="middle" font-size="19" font-weight="bold">DECIDE</text><path d="M410 45Q575 45 585 135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M585 195Q575 285 420 295" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M300 295Q140 285 135 200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M135 135Q140 45 300 45" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M100 190L40 270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="53" y="298" text-anchor="middle" font-size="16" font-weight="normal">STOP</text></g></svg>